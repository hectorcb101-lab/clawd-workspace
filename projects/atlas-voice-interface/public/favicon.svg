<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0f"/>
  
  <!-- Column pillars (simplified Greek temple) -->
  <g fill="url(#grad)" filter="url(#glow)">
    <!-- Left pillar -->
    <rect x="25" y="35" width="8" height="35" rx="1"/>
    <!-- Right pillar -->
    <rect x="67" y="35" width="8" height="35" rx="1"/>
    <!-- Center pillar (taller) -->
    <rect x="46" y="30" width="8" height="40" rx="1"/>
    
    <!-- Top beam -->
    <rect x="20" y="28" width="60" height="6" rx="2"/>
    
    <!-- Triangular pediment -->
    <polygon points="50,15 20,28 80,28"/>
    
    <!-- Base -->
    <rect x="18" y="70" width="64" height="5" rx="1"/>
  </g>
  
  <!-- Glowing center orb -->
  <circle cx="50" cy="50" r="6" fill="#60a5fa" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
